name: Sync Sources & Validate Vault Topology

on:
  schedule:
    # 每日凌晨 UTC 00:00 (北京时间 08:00) 自动触发同步
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spacemit-wiki-source-sync
  cancel-in-progress: false

jobs:
  sync-and-validate:
    name: Sync Submodules & Run Linker Lint
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Make sync script executable
        run: chmod +x update_sources.sh

      - name: Execute submodule sync
        run: ./update_sources.sh

      - name: Run Vault Linker Lint
        run: python3 vault_linker_lint.py

      - name: Run Content Integrity & Anti-Hallucination Lint
        run: python3 scripts/lint_wiki_integrity.py

      - name: Test production index builder
        run: |
          python3 -B scripts/test_build_mcp_index.py
          python3 -B scripts/test_upstream_impact.py
          python3 -B -m unittest discover -s mcp -p 'test_server.py'

      - name: Preserve freshness and upstream impact reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-maintenance-reports
          path: reports/*.json
          if-no-files-found: warn

      - name: Rebuild and validate both MCP indexes after source sync
        run: |
          python3 scripts/build_mcp_index.py --if-changed
          python3 scripts/build_mcp_index.py --check

      - name: Commit and push changes if updated
        id: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "检测到子模块更新或文档变更，正在自动提交并推送..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(auto-sync): 自动同步 Spacemit 官方文档子模块及校验拓扑 [skip ci]"
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "未检测到任何文档变动，跳过 Commit & Push。"
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN 的 push 不会触发另一个 push workflow，显式调用部署流程。
  deploy-synced-mcp:
    needs: sync-and-validate
    if: needs.sync-and-validate.outputs.changed == 'true'
    uses: ./.github/workflows/deploy_mcp.yml
    with:
      ref: ${{ needs.sync-and-validate.outputs.commit }}
    secrets: inherit
