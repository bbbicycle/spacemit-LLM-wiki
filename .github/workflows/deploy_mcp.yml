name: Auto Build & Deploy MCP to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'Developer_Journeys/**'
      - 'Knowledge_Atoms/**'
      - 'Evidence/**'
      - 'Sources/**'
      - 'scripts/**'
      - 'evals/**'
      - 'mcp-worker/**'
      - 'mcp/**'
      - 'Agent.md'
      - 'AGENTS.md'
      - 'skill/**'
      - 'docs/**'
      - '.github/workflows/deploy_mcp.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Repository commit or tag to deploy (also used for rollback)
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: Exact repository commit produced by the source sync job
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: spacemit-wiki-production-deploy
  cancel-in-progress: false

jobs:
  deploy-mcp:
    name: Build Graph Index & Deploy MCP Worker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate documents and production index builder
        run: |
          python3 vault_linker_lint.py
          python3 scripts/lint_wiki_integrity.py
          python3 -B scripts/test_build_mcp_index.py
          python3 -B scripts/test_upstream_impact.py
          python3 -B -m unittest discover -s mcp -p 'test_server.py'
          python3 -B scripts/test_minimal_install.py
          python3 -B scripts/test_eval_stage_b.py

      - name: Rebuild and validate MCP Dual-Layer Knowledge Index
        run: |
          echo "Deployment ref: $(git rev-parse HEAD)"
          python3 scripts/build_mcp_index.py --freshness-report reports/freshness.json
          python3 scripts/build_mcp_index.py --check

      - name: Preserve freshness maintenance queue
        uses: actions/upload-artifact@v4
        with:
          name: freshness-report
          path: reports/freshness.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Worker dependencies
        working-directory: mcp-worker
        run: npm ci --no-audit --no-fund

      - name: Check Worker types
        working-directory: mcp-worker
        run: npx tsc --noEmit

      - name: Test production Worker runtime
        run: |
          node --disable-warning=ExperimentalWarning mcp-worker/test_runtime.cjs
          node --disable-warning=ExperimentalWarning mcp-worker/test_index_runtime.cjs

      - name: Run 20 source-grounded retrieval and notice evaluations
        run: python3 -B scripts/eval_stage_b.py

      - name: Preserve core evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-core-20
          path: reports/stage_b/

      - name: Initialize D1 Database Schema
        continue-on-error: true
        working-directory: mcp-worker
        run: |
          npx wrangler d1 execute spacemit-wiki-db --remote --file=schema.sql -y
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        working-directory: mcp-worker
        run: |
          npx wrangler deploy --var "DEPLOYMENT_REF:$(git rev-parse HEAD)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployed version and MCP behavior
        run: |
          python3 -B scripts/smoke_mcp.py --url https://mcp.yao1302.xyz --expected-ref "$(git rev-parse HEAD)" --index mcp/data/wiki_graph.json
